name: 自动签到 2

on:
  schedule:
    # GitHub 的 cron 使用 UTC；每 30 分钟唤醒一次（与「自动签到」错开 10 分钟），
    # 由 schedule.mjs 判断是否到达 24~25 小时的时间点
    - cron: "19,49 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 忽略 24~25 小时间隔，立即执行一次
        type: boolean
        default: true

permissions:
  contents: read # actions/checkout 读取代码
  actions: write # actions/cache 读写运行状态

# 同一时间只允许一个签到流程，后触发的排队等待（避免并发写状态）
concurrency:
  group: auto-checkin2
  cancel-in-progress: false

jobs:
  checkin:
    name: 执行签到
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 需大于 登录错峰上限（登录即签到，没有登录后的等待）
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 恢复运行状态
        uses: actions/cache/restore@v4
        with:
          path: .checkin2-state
          key: checkin2-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            checkin2-state-

      - name: 检查账号配置与执行时间
        id: gate
        env:
          CHECKIN_STATE_DIR: .checkin2-state
          ACCOUNTS: ${{ secrets.CHECKIN2_ACCOUNTS }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$ACCOUNTS" ]; then
            echo "未配置 CHECKIN2_ACCOUNTS，本次跳过（在 Secrets 中配置后会自动启用）"
            echo "跳过原因：未配置 CHECKIN2_ACCOUNTS" >> "$GITHUB_STEP_SUMMARY"
            echo "due=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE" != "false" ]; then
            echo "手动触发，跳过时间间隔检查"
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            node schedule.mjs due
          fi

      - name: 执行签到
        id: checkin
        if: steps.gate.outputs.due == 'true'
        continue-on-error: true
        env:
          CHECKIN2_ACCOUNTS: ${{ secrets.CHECKIN2_ACCOUNTS }}
          CHECKIN2_BASE_URL: ${{ vars.CHECKIN2_BASE_URL }}
          CHECKIN2_LOGIN_STAGGER_MIN: ${{ vars.CHECKIN2_LOGIN_STAGGER_MIN }}
          CHECKIN2_LOGIN_STAGGER_MAX: ${{ vars.CHECKIN2_LOGIN_STAGGER_MAX }}
          CHECKIN2_CONCURRENCY: ${{ vars.CHECKIN2_CONCURRENCY }}
          CHECKIN2_RETRIES: ${{ vars.CHECKIN2_RETRIES }}
          CHECKIN2_RETRY_WAIT_MIN: ${{ vars.CHECKIN2_RETRY_WAIT_MIN }}
          CHECKIN2_RETRY_WAIT_MAX: ${{ vars.CHECKIN2_RETRY_WAIT_MAX }}
        run: node checkin2.mjs

      - name: 更新运行状态
        if: steps.gate.outputs.due == 'true'
        env:
          CHECKIN_STATE_DIR: .checkin2-state
        run: node schedule.mjs update --status=${{ steps.checkin.outcome }}

      - name: 保存运行状态
        if: steps.gate.outputs.due == 'true'
        uses: actions/cache/save@v4
        with:
          path: .checkin2-state
          key: checkin2-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 总结
        if: always()
        run: |
          if [ "${{ steps.gate.outcome }}" != "success" ]; then
            echo "判断执行时间失败，请查看上方日志" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${{ steps.gate.outputs.due }}" != "true" ]; then
            echo "本次未执行（未到执行时间或未配置账号，详见上方「检查账号配置与执行时间」步骤）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ steps.checkin.outcome }}" = "failure" ]; then
            echo "签到失败，请查看上方日志" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "签到流程执行完成" >> "$GITHUB_STEP_SUMMARY"
